server:
  port: 8081

spring:
  profiles:
    active: dev
  application:
    name: ms-digitalfix-workorders

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/6e49fdba-8435-41ac-8074-7b1a04cfd543/v2.0

  rabbitmq:
    # Los dos nodos del cluster. Si el primero cae, la conexion pasa al segundo.
    addresses: ${RABBIT_ADDRESSES:localhost:5672,localhost:5673}
    # No se usa guest: RabbitMQ lo bloquea para cualquier conexion que no venga
    # del propio broker, asi que desde otro host o contenedor nunca conecta.
    username: ${RABBIT_USER:digitalfix}
    password: ${RABBIT_PASS:digitalfix}
    virtual-host: /
    # Confirmaciones del broker. Sin esto, publicar a un exchange inexistente
    # se descarta en silencio y el mensaje desaparece sin dejar rastro.
    publisher-confirm-type: correlated
    publisher-returns: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

digitalfix:
  security:
    audiences:
      - 13a645a9-ea0e-498e-96b8-55a3d56f10eb
      - api://13a645a9-ea0e-498e-96b8-55a3d56f10eb
  cors:
    allowed-origins:
      - http://localhost:8080
  # ---------------------------------------------------------------------------
  # Catalog: se consulta de forma sincrona al asignar una orden con repuesto,
  # para descontar stock antes de confirmar la asignacion. En local apunta a
  # localhost; en AWS se sobreescribe con la IP privada de la instancia.
  # ---------------------------------------------------------------------------
  catalog:
    base-url: ${CATALOG_URL:http://localhost:8082}
  # ---------------------------------------------------------------------------
  # Destinos de publicacion.
  #
  # Este microservicio solo produce, asi que no declara colas: le basta saber
  # a que exchange y con que clave enviar. La topologia completa vive en
  # ms-digitalfix-notify, que es quien consume.
  #
  # Poner habilitada en false permite levantarlo sin broker, util para
  # trabajar en el CRUD sin montar la infraestructura.
  # ---------------------------------------------------------------------------
  mensajeria:
    habilitada: ${MENSAJERIA_HABILITADA:true}
    exchanges:
      direct: cmd.direct
      topic: cmd.topic
    routing-keys:
      email: email.send
      dispatch: dispatch.ticket
      report: report.gen

  # ---------------------------------------------------------------------------
  # Productor de digitalfix.workorders.events. Lo consumen ms-digitalfix-audit
  # (grupo audit-timeline) y ms-digitalfix-report (grupo report-metrics), cada
  # uno con su propio offset sobre el mismo topico.
  #
  # Poner habilitada en false permite levantarlo sin Kafka, igual que
  # mensajeria.habilitada para RabbitMQ.
  # ---------------------------------------------------------------------------
  kafka:
    habilitada: ${KAFKA_HABILITADA:true}
    topics:
      workorders-events: digitalfix.workorders.events
